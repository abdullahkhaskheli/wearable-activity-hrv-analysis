[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "wearable-hrv"
version = "0.1.0"
description = "Reproducible PPG-DaLiA research analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<4", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.9,<4", "plotly>=5.18,<7", "streamlit>=1.49,<2", "PyYAML>=6,<7", "joblib>=1.3,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["real_data: requires installed PPG-DaLiA recordings"]
